<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Luxia Labs — Hora de entrega</title>
<style>
  :root{ --paper:#f4f2ef; --ink:#2b2b34; --violet:#6c5ce7; --dim:#8a837d; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--dim);
    font:400 11px/1.6 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    letter-spacing:.13em; text-transform:uppercase;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; padding:10px; overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    background-image:
      linear-gradient(#eceae6 1px, transparent 1px),
      linear-gradient(90deg,#eceae6 1px, transparent 1px);
    background-size:32px 32px, 32px 32px;
  }
  #screen{
    display:block; image-rendering:pixelated; image-rendering:crisp-edges;
    border:1px solid #cbc5bf; background:#8e8781;
    box-shadow:0 18px 46px -14px rgba(43,43,52,.34), 0 2px 0 0 #ffffff inset;
    touch-action:none; outline:none;
  }
  #screen:focus-visible{ border-color:var(--violet) }
  .bar{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; align-items:center; }
  .t{ color:var(--violet); letter-spacing:.3em }
  b{ color:var(--ink); font-weight:400 }
  kbd{ font:inherit; letter-spacing:.06em; color:var(--ink); background:#fff;
       border:1px solid #d6d0ca; border-bottom-width:2px; border-radius:3px; padding:1px 5px }
  .sep{ color:#d6d0ca }
  @media(max-width:640px){ .desk{display:none} }
  @media(min-width:641px){ .touch{display:none} }

  .stage{ position:relative; display:inline-block; }

  /* Controls live below the canvas, in normal page flow -- never over the
     game, so they can't cover a dialogue box. */
  #touchpad{
    display:none; align-items:center; justify-content:space-between;
    width:100%; max-width:420px; margin-top:4px;
  }
  @media(max-width:640px){ #touchpad{display:flex} }
  #touchpad button{
    touch-action:none; font:400 11px ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    letter-spacing:.04em; color:var(--ink); background:rgba(247,245,242,.92);
    border:1px solid #cbc5bf; border-bottom-width:3px; border-radius:10px;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  #touchpad button:active{ background:rgba(108,92,231,.24); border-bottom-width:1px; transform:translateY(2px); }

  /* Floating joystick: wherever you first touch inside the zone becomes the
     centre. Base + knob are positioned in JS and hidden until touched. */
  .tp-joyzone{
    position:relative; width:120px; height:120px; touch-action:none;
    flex-shrink:0; overflow:hidden;
    background:rgba(255,255,255,.42);
    border:1px dashed rgba(108,92,231,.42); border-radius:14px;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.28);
  }
  .tp-joyzone::before{
    content:'MOVER · TOCA Y ARRASTRA'; position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:14px; color:rgba(43,43,52,.42); font-size:9px; line-height:1.5;
    pointer-events:none;
  }
  .tp-joybase, .tp-joyknob{
    position:absolute; border-radius:50%; opacity:0; pointer-events:none;
    transform:translate(-50%,-50%);
  }
  .tp-joybase{ width:76px; height:76px; background:rgba(108,92,231,.10); border:1px solid rgba(108,92,231,.35); }
  .tp-joyknob{ width:34px; height:34px; background:rgba(108,92,231,.30); border:1px solid rgba(108,92,231,.55); }

  .tp-mid{ display:flex; flex-direction:column; gap:6px; }
  .tp-small{ width:34px; height:26px; font-size:10px; }
  .pause-icon{
    display:inline-block; width:12px; height:13px; vertical-align:middle;
    background:linear-gradient(90deg,currentColor 0 4px,transparent 4px 8px,currentColor 8px 12px);
  }
  .tp-right{ display:flex; align-items:center; gap:8px; }
  .tp-ph{ width:36px; height:36px; border-radius:50%; font-size:15px; }
  .tp-e{ width:54px; height:54px; border-radius:50%; font-size:15px; }
</style>
</head>

// ---------- SURFACES ----------
function surf(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return [c, g];
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const cl = v => Math.max(0, Math.min(255, Math.round(v)));
  const r = cl(((n >> 16) & 255) * f), g = cl(((n >> 8) & 255) * f), b = cl((n & 255) * f);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

function drawPerson(g, s, facing, frame) {
  const skin = SKIN[s.sk] || s.sk;
  const hair = HAIR[s.hc] || s.hc || '#1e1823';
  const fcol = HAIR[s.fc] || s.fc || hair;
  const lift = frame ? 1 : 0;                 // 1px bob on the off-frame
  const dy = (s.tl === 1 ? 0 : s.tl === -1 ? 2 : 1) - lift;
  const hy = 1 + dy;
  const ty = hy + 6;                          // torso top
  const bw = 4 + (s.bd || 0);
  const x0 = 7 - bw, tw = bw * 2;
  const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  const side = facing === 'left' || facing === 'right';

  // --- legs and shoes
  if (s.st === 'dress') {
    for (let y = 13 - lift; y <= 16 - lift; y++) {
      const sp = y - (13 - lift);
      R(x0 - (sp > 1 ? 1 : 0), y, tw + (sp > 1 ? 2 : 0), 1, s.top);
    }
    R(4, 17 - lift, 2, 1, s.sh); R(8, 17 - lift, 2, 1, s.sh);
  } else {
    const lg = s.bot;
    R(4, 13 - lift, 2, 4 - lift, lg);
    R(8, 13 - lift, 2, 4 - (frame ? 1 : 0) - lift, lg);
    R(4, 17 - lift, 2, 1, s.sh);
    R(8, 16 - (frame ? 1 : 0) - lift, 2, 1, s.sh);
  }

  // --- torso, with a one-pixel shoulder slope
  for (let y = ty; y <= 12 - lift; y++) {
    const ins = y === ty ? 1 : 0;
    R(x0 + ins, y, tw - ins * 2, 1, s.top);
  }
  R(x0, 12 - lift, 1, 1, skin); R(x0 + tw - 1, 12 - lift, 1, 1, skin);  // hands

  // --- garment detail
  const lite = shade(s.top, 1.22), dark = shade(s.top, 0.72);
  if (s.st === 'business') {
    R(6, ty, 2, 2, s.sh === '#23232b' ? '#f2f0ec' : lite);
    R(7, ty + 2, 1, 3, dark);
  } else if (s.st === 'bizcas') {
    R(5, ty, 1, 1, lite); R(8, ty, 1, 1, lite); R(6, ty, 2, 1, skin);
  } else if (s.st === 'sport') {
    R(x0 + 1, ty + 2, tw - 2, 1, lite);
  } else if (s.st === 'casual') {
    R(6, ty, 2, 1, shade(skin, 0.92));
  }

  // --- head
  const hx = side ? 4 : 3, hw2 = side ? 6 : 7;
  R(hx + 1, hy, hw2 - 1, 5, skin);
  R(hx, hy + 1, 1, 3, skin); R(hx + hw2, hy + 1, 1, 3, skin);
  if (facing === 'up') {
    R(3, hy, 8, 4, hair);                    // back of the head
  } else if (side) {
    R(9, hy + 2, 1, 1, skin);                // nose
    R(7, hy + 2, 1, 1, P.ink);               // one eye
  } else {
    R(5, hy + 2, 1, 1, P.ink); R(8, hy + 2, 1, 1, P.ink);
  }

  // --- hair
  const rows = HAIRSTYLE[s.hs] || HAIRSTYLE.short;
  for (const [ry, rx, rw] of rows) {
    let x = rx, w = rw;
    if (side) { if (x + w > 10) w = Math.max(1, 10 - x); if (x > 9) continue; }
    R(x, hy + ry, w, 1, hair);
  }
  if (s.hr) R(4, hy - 2, 6, 1, HAIR[s.hr]);   // grown-out roots
  if (s.hs === 'slick' && facing !== 'up') R(5, hy - 1, 4, 1, shade(hair, 1.5));

  // --- facial hair and glasses (front and profile only)
  if (facing !== 'up' && s.fh && s.fh !== 'none' && FACIAL[s.fh]) {
    for (const [ry, rx, rw] of FACIAL[s.fh]) {
      let x = rx, w = rw;
      if (side) { if (x + w > 10) w = Math.max(1, 10 - x); if (x > 9) continue; }
      R(x, hy + ry, w, 1, fcol);
    }
  }
  if (facing !== 'up' && s.gl) {
    R(3, hy + 2, 8, 1, P.ink);
    R(4, hy + 2, 2, 1, '#cfe4ea'); R(7, hy + 2, 2, 1, '#cfe4ea');
  }
}

function bakePerson(spec) {
  const out = {};
  for (const f of ['down', 'up', 'left']) {
    out[f] = [0, 1].map(fr => {
      const [c, g] = surf(PW, PH);
      drawPerson(g, spec, f, fr);
      return c;
    });
  }
  out.right = out.left;    // mirrored at draw time
  return out;
}
const PLAYER_EXTRA = 6, PLAYER_PH = PH + PLAYER_EXTRA;
function stretchTaller(sprSet, extra) {
  const h2 = PH + extra, out = {};
  for (const dir of ['down', 'up', 'left']) {
    out[dir] = sprSet[dir].map(frame => {
      const [c, g] = surf(PW, h2);
      g.drawImage(frame, 0, 0, PW, h2);   // nearest-neighbour stretch, stays crisp
      return c;
    });
  }
  out.right = out.left;
  return out;
}

// Large-format porcelain: grout falls on every other tile edge so the slabs
// read at 32px, matching the real floor in the photos.
let TILES = {};
function bakePorc(dark) {
  // The porcelain-slab generator, parameterized by a shade factor so a room
  // like the closet can use the same pattern a notch darker.
  const out = [];
  for (let gy = 0; gy < 2; gy++) for (let gx = 0; gx < 2; gx++) for (let v = 0; v < 3; v++) {
    const [c, g] = surf(TS, TS);
    g.fillStyle = shade([P.floor0, P.floor1, P.floor2][v], dark); g.fillRect(0, 0, TS, TS);
    let s = (gx * 31 + gy * 57 + v * 113) | 0;
    const rnd = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
    for (let i = 0; i < 9; i++) {                      // faint veining
      const vx = (rnd() * TS) | 0, vy = (rnd() * TS) | 0, len = 2 + ((rnd() * 4) | 0);
      g.fillStyle = shade(rnd() < 0.5 ? P.floor0 : P.floor1, dark * (rnd() < 0.5 ? 0.95 : 1.04));
      g.fillRect(vx, vy, len, 1);
    }
    g.fillStyle = shade(P.grout, dark);
    if (gx === 0) g.fillRect(0, 0, 1, TS);
    if (gy === 0) g.fillRect(0, 0, TS, 1);
    out.push(c);
  }
  return out;
}
function bakeTiles() {
  TILES.porc = bakePorc(1);
  TILES.porcDk = bakePorc(0.80);       // closet, or any room with f:'porcDk'
  const simple = (base, grout, noise) => {
    const out = [];
    for (let v = 0; v < 3; v++) {
      const [c, g] = surf(TS, TS);
      g.fillStyle = v === 1 ? shade(base, 1.05) : v === 2 ? shade(base, 0.95) : base;
      g.fillRect(0, 0, TS, TS);
      let s = v * 977 + 7;
      const rnd = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
      for (let i = 0; i < noise; i++) {
        g.fillStyle = rnd() < 0.5 ? shade(base, 0.9) : shade(base, 1.1);
        g.fillRect((rnd() * TS) | 0, (rnd() * TS) | 0, 1, 1);
      }
      if (grout) { g.fillStyle = grout; g.fillRect(0, 0, 1, TS); g.fillRect(0, 0, TS, 1); }
      out.push(c);
    }
    return out;
  };
  TILES.pasillo = simple('#b4aeaa', '#9a938e', 14);
  TILES.turf = simple(P.turf, null, 46);
}

// ---------- WORLD ----------
const world = {
  tiles: [], solid: [], mat: [], room: [],
  people: [], props: [], wet: [], motes: [],
  step: 0, clock: 900, over: 0, hint: '', hintT: 0, fired: [],
  hp: null, coffee: 3, boost: 0, shake: 0, t: 0, talked: {},
  dlg: null, dlgPage: 0, sparks: [],
  paused: false, printed: false, postT: 0,
};
const player = {
  // Collision box hangs at the feet with clearance top and bottom so it sits
  // inside one tile row instead of straddling into the furniture below.
  x: 0, y: 0, hw: 4, top: -5, bot: 1, face: 'down', anim: 0, moving: false,
  hopho: 0, phCharge: 1, slip: 0, vx: 0, vy: 0,
};
const CLOCK_END = 1080;        // 18:00
const SEC_PER_MIN = 1.25;
const SPEED = 74;
const INTRO_LOCK = 3.5;      // matches the banner's own fade-out in drawOverlays

function inRect(x, y, r) { return x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h; }

function buildWorld() {
  world.tiles = []; world.solid = []; world.mat = []; world.room = []; world.wall = []; world.floor = [];
  for (let y = 0; y < MAPH; y++) {
    world.tiles.push(new Array(MAPW).fill('#'));
    world.solid.push(new Array(MAPW).fill(1));
    world.mat.push(new Array(MAPW).fill('paint'));
    world.room.push(new Array(MAPW).fill(''));
    world.floor.push(new Array(MAPW).fill('porc'));
  }
  const carve = (x, y, w, h, f, name) => {
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) {
      if (i < 0 || j < 0 || i >= MAPW || j >= MAPH) continue;
      world.tiles[j][i] = '.'; world.solid[j][i] = 0;
      world.mat[j][i] = f; world.room[j][i] = name; world.floor[j][i] = f;
    }
  };
  for (const r of ROOMS) {
    if (r.box) {                                  // partition ring first
      for (let j = r.y - 1; j <= r.y + r.h; j++) for (let i = r.x - 1; i <= r.x + r.w; i++) {
        if (i < 0 || j < 0 || i >= MAPW || j >= MAPH) continue;
        world.tiles[j][i] = '#'; world.solid[j][i] = 1; world.mat[j][i] = r.box;
      }
    }
    carve(r.x, r.y, r.w, r.h, r.f, r.n);
  }
  for (const d of DOORS) {
    for (let j = d.y; j < d.y + d.h; j++) for (let i = d.x; i < d.x + d.w; i++) {
      world.tiles[j][i] = 'D'; world.solid[j][i] = 0;
      world.mat[j][i] = d.k; if (!world.room[j][i]) world.room[j][i] = 'PASO';
    }
  }
  for (const b of BLOCKS) {
    for (let j = b.y; j < b.y + b.h; j++) for (let i = b.x; i < b.x + b.w; i++) {
      world.mat[j][i] = 'hatch'; world.room[j][i] = b.n;
    }
  }
  for (const g of GLASSWALLS) {
    const mat = g.notes === false ? 'glassClean' : 'glass';
    for (let j = g.y; j < g.y + g.h; j++) for (let i = g.x; i < g.x + g.w; i++) {
      if (i < 0 || j < 0 || i >= MAPW || j >= MAPH) continue;
      if (world.solid[j][i]) world.mat[j][i] = mat;   // only touches real wall tiles
    }
  }

  // Snapshot the architecture BEFORE furniture is stamped in. world.solid goes
  // on to include furniture too (it has to, for collision); world.wall stays
  // "is this actually a wall", which is what floor and partition rendering
  // should key off instead.
  world.wall = world.solid.map(row => row.slice());

  // furniture occupies tiles; most of it is solid
  world.props = [];
  for (const f of FURN) {
    world.props.push(Object.assign({}, f));
    if (f.t === 'gchair') continue;              // guest chairs are walk-through
    for (let j = f.y; j < f.y + f.h; j++) for (let i = f.x; i < f.x + f.w; i++) {
      if (i < 0 || j < 0 || i >= MAPW || j >= MAPH) continue;
      world.solid[j][i] = 1;
    }
  }

  // people
  world.people = PEOPLE.filter(p => p.kind !== 'none').map(p => ({
    def: p, x: p.tx * TS + 8, y: p.ty * TS + 12,
    face: p.face || 'down', node: 1, cool: 0, anim: 0, moving: false,
    spr: bakePerson(p.spec), signed: false, said: 0,
  }));

  player.x = 18 * TS + 8; player.y = 28 * TS + 12;
  player.face = 'down'; player.hopho = 0; player.phCharge = 1; player.slip = 0;
  world.step = 0; world.clock = 900; world.over = 0; world.coffee = 3; world.paused = false;
  world.printed = false; world.postT = 0;
  world.boost = 0; world.talked = {}; world.dlg = null; world.wet = [];
  world.fired = ZONES.map(() => false); world.sparks = []; world.shake = 0;
  world.motes = [];
  for (let i = 0; i < 60; i++) world.motes.push({
    x: Math.random() * VW, y: Math.random() * VH,
    vx: 3 + Math.random() * 7, vy: -2 + Math.random() * 4, a: 0.10 + Math.random() * 0.22,
  });
  playerSpr = stretchTaller(bakePerson(PLAYER_SPEC), PLAYER_EXTRA);
}
let playerSpr = null;

function solidAt(px, py) {
  const tx = Math.floor(px / TS), ty = Math.floor(py / TS);
  if (tx < 0 || ty < 0 || tx >= MAPW || ty >= MAPH) return 1;
  return world.solid[ty][tx];
}
function roomAt(px, py) {
  const tx = Math.floor(px / TS), ty = Math.floor(py / TS);
  if (tx < 0 || ty < 0 || tx >= MAPW || ty >= MAPH) return '';
  return world.room[ty][tx];
}
function free(nx, ny) {
  const { hw, top, bot } = player;
  for (const [ox, oy] of [[-hw, top], [hw - .01, top], [-hw, bot], [hw - .01, bot]]) {
    if (solidAt(nx + ox, ny + oy)) return false;
  }
  return true;
}
// Corner nudge: if a step is blocked but would clear a couple of pixels to one
// side, take it. Without this you snag on every desk corner in the taller.
const NUDGE = [-1, 1, -2, 2, -3, 3];
function moveBy(dx, dy) {
  const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 2));
  const sx = dx / steps, sy = dy / steps;
  for (let i = 0; i < steps; i++) {
    if (sx) {
      if (free(player.x + sx, player.y)) player.x += sx;
      else for (const n of NUDGE) {
        if (free(player.x + sx, player.y + n)) { player.x += sx; player.y += n; break; }
      }
    }
    if (sy) {
      if (free(player.x, player.y + sy)) player.y += sy;
      else for (const n of NUDGE) {
        if (free(player.x + n, player.y + sy)) { player.y += sy; player.x += n; break; }
      }
    }
  }
}

// ---------- PATHFINDING ----------
// Straight-line routes walk colleagues straight into the desks, so roamers get
// a real path over the tile grid, recomputed once per leg.
function findPath(sx, sy, gx, gy) {
  if (sx === gx && sy === gy) return [];
  const prev = new Int32Array(MAPW * MAPH).fill(-2);
  const q = [sy * MAPW + sx];
  prev[sy * MAPW + sx] = -1;
  for (let h = 0; h < q.length; h++) {
    const cur = q[h], cx = cur % MAPW, cy = (cur / MAPW) | 0;
    if (cx === gx && cy === gy) {
      const out = [];
      let k = cur;
      while (k !== -1) { out.push([k % MAPW, (k / MAPW) | 0]); k = prev[k]; }
      return out.reverse().slice(1);
    }
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= MAPW || ny >= MAPH) continue;
      const ni = ny * MAPW + nx;
      if (prev[ni] !== -2 || world.solid[ny][nx]) continue;
      prev[ni] = cur; q.push(ni);
    }
  }
  return null;
}

// ---------- DIALOGUE ----------
// `choices`, if given, only takes effect on the last page: instead of E
// closing the dialogue, it becomes "confirm the highlighted option". A/D or
// the arrow keys move the highlight while a choice is showing.
function openDialogue(who, pages, cost, choices) {
  world.dlg = { who, pages: Array.isArray(pages) ? pages : [pages], cost: cost || 0,
    choices: choices || null, choiceIndex: 0 };
  world.dlgPage = 0;
}
function closeDialogue() {
  if (world.dlg && world.dlg.cost) world.clock += world.dlg.cost;
  world.dlg = null;
}
function onLastPage() { return world.dlg && world.dlgPage === world.dlg.pages.length - 1; }
function advanceDialogue() {
  if (!world.dlg) return;
  if (world.dlgPage < world.dlg.pages.length - 1) { world.dlgPage++; return; }
  if (world.dlg.choices) return;          // last page with choices: E selects, handled elsewhere
  const d = world.dlg;
  closeDialogue();
  if (d.onEnd) d.onEnd();
}
function cycleChoice(dir) {
  if (!onLastPage() || !world.dlg.choices) return;
  const n = world.dlg.choices.length;
  world.dlg.choiceIndex = (world.dlg.choiceIndex + dir + n) % n;
}
function selectChoice() {
  if (!onLastPage() || !world.dlg.choices) return;
  const c = world.dlg.choices[world.dlg.choiceIndex];
  closeDialogue();
  if (c && c.run) c.run();
}

const keys = {};
let ePressed = false;

// ---------- INTERACTION ----------
function nearestTarget() {
  let best = null, bd = 1e9;
  for (const p of world.people) {
    const d = Math.hypot(player.x - p.x, player.y - (p.y - 4));
    if (d < 24 && d < bd) { bd = d; best = { kind: 'person', p }; }
  }
  for (const f of world.props) {
    if (f.t !== 'coffee' && f.t !== 'plotter') continue;
    const cx = f.x * TS + f.w * TS / 2, cy = f.y * TS + f.h * TS / 2;
    const d = Math.hypot(player.x - cx, player.y - cy);
    if (d < 26 && d < bd) { bd = d; best = { kind: f.t, f }; }
  }
  return best;
}

function interact() {
  if (world.dlg) {
    if (onLastPage() && world.dlg.choices) selectChoice(); else advanceDialogue();
    return;
  }
  if (world.over) return;
  if (player.hopho > 0) { openDialogue(null, ['NO ESCUCHAS NADA.\n(QUÍTATE LOS AURICULARES CON ESPACIO)'], 0); return; }
  const t = nearestTarget();
  if (!t) return;

  if (t.kind === 'coffee') {
    if (world.coffee <= 0) { openDialogue('CAFETERA', ['SE ACABÓ EL CAFÉ.\nCLÁSICO.'], 0); return; }
    world.coffee--; world.boost = 18;
    openDialogue('CAFETERA', ['CAFÉ. CAMINAS MÁS RÁPIDO POR UN RATO.'], 2);
    return;
  }
  if (t.kind === 'plotter') {
    if (world.step < 4) {
      openDialogue('IMPRESORA', ['NO HAY NADA QUE IMPRIMIR AHORA.'], 1);
    } else if (world.printed) {
      openDialogue('IMPRESORA', ['LA IMPRESIÓN ESTÁ LISTA.\nLLÉVALA CONTIGO.'], 1);
    } else {
      world.printed = true;
      openDialogue('IMPRESORA', ['IMPRIMIENDO...', 'LÁMINAS LISTAS.\nYA PUEDES LLEVÁRSELAS A JUAN RAÚL.'], 2);
      world.dlg.onEnd = () => showHint('IMPRESIÓN LISTA\nSIGUIENTE: ' + objectiveLabel(currentObjective()), 5);
    }
    return;
  }

  const p = t.p, def = p.def;
  const want = CHAIN[world.step];
  if (want && def.id === want.id) {
    startChainStep(p, 5);
    return;
  }
  const chainMember = CHAIN.some(c => c.id === def.id);
  if (chainMember && p.signed) {
    openDialogue(def.name, def.id === 'gaviota' ? gaviotaGuidance() : ['YA TE FIRMÉ. SIGUE.'], 1);
  } else if (def.id === 'juan' && !world.printed) {
    const msg = world.step < 4
      ? 'PRIMERO CONSIGUE CONFIRMACIÓN DEL INICIO DEL PROYECTO CON CRISMERY.'
      : world.step === 4
        ? 'REVÍSALO CON LAURA Y PASA POR LA IMPRESORA.\nNO LO VEO SIN LAS LÁMINAS IMPRESAS.'
        : 'IMPRIME LAS LÁMINAS.\nNO LO VEO EN PANTALLA.';
    openDialogue(def.name, [msg], 1);
  } else if (chainMember) {
    openDialogue(def.name, ['TODAVÍA NO.\n' + (currentObjective() ? currentObjective().task : '')], 1);
  } else if (def.id === 'aracelis') {
    const dd = aracelisDialogue();
    openDialogue(def.name + ' — ' + def.role, dd.pages, 2, dd.choices);
  } else {
    openDialogue(def.name + ' — ' + def.role, [def.chat || '...'], 2);
  }
}

function startChainStep(p, cost) {
  const def = p.def, want = CHAIN[world.step];
  if (!want || want.id !== def.id) return;
  if (def.id === 'juan' && !world.printed) {
    openDialogue(def.name + ' — ' + def.role,
      ['ANTES DE VERLO CONMIGO, VE A LA IMPRESORA.\nTRÁEME LAS LÁMINAS IMPRESAS.'], 1);
    return;
  }
  const pages = def.id === 'laura' && !world.printed
    ? def.lines.concat(['ANTES DE IR CON JUAN, PASA POR LA IMPRESORA.\nLLÉVALE LAS LÁMINAS IMPRESAS.'])
    : def.lines;
  const isLast = world.step === CHAIN.length - 1;
  openDialogue(def.name + ' — ' + def.role, pages, cost);
  world.dlg.onEnd = () => {
    // Dialogue costs count against the deadline. Closing the final conversation
    // at 18:00 or later is too late, even if it began before the cutoff.
    if (world.clock >= CLOCK_END) { world.over = 2; return; }
    p.signed = true; world.step++;
    if (isLast) { world.over = 3; world.postT = 0; return; }
    world.sparks.push({ x: p.x, y: p.y - 10, life: 1 });
    showHint(completionHint(want), 5);
  };
}

function showHint(t, d) { world.hint = t; world.hintT = d; }

// Aracelis offers coffee same as the machine: -1 cup, +18s speed boost, and
// the same 2 extra game-minutes it costs at the machine (charged only if
// you say yes -- the base interruption/chat cost is charged separately).
function aracelisDialogue() {
  return {
    pages: ['MI HIJO, CUIDADO DONDE PISAS.\nQUE ACABO DE SUAPEAR AHÍ.', '¿QUIERES UN CAFÉ?'],
    choices: [
      { label: 'SÍ, GRACIAS', run: () => {
          if (world.coffee <= 0) { openDialogue('ARACELIS DEL ROSARIO', ['SE ACABÓ EL CAFÉ. LO SIENTO, MI HIJO.'], 0); return; }
          world.coffee--; world.boost = 18; world.clock += 2;
          openDialogue('ARACELIS DEL ROSARIO', ['TOMA, CON CUIDADO QUE ESTÁ CALIENTE.'], 0);
        } },
      { label: 'NO, GRACIAS', run: () => {} },
    ],
  };
}

// ---------- UPDATE ----------
function update(dt) {
  if (world.paused) return;               // freezes everything: clock, motion, animation
  world.t += dt;
  world.shake = Math.max(0, world.shake - dt * 20);
  if (world.hintT > 0) world.hintT -= dt;
  for (let i = world.sparks.length - 1; i >= 0; i--) {
    world.sparks[i].life -= dt * 1.3;
    if (world.sparks[i].life <= 0) world.sparks.splice(i, 1);
  }
  for (const m of world.motes) {
    m.x += m.vx * dt; m.y += m.vy * dt;
    if (m.x > VW) { m.x = -4; m.y = Math.random() * VH; }
    if (m.y < 0) m.y = VH; if (m.y > VH) m.y = 0;
  }
  for (let i = world.wet.length - 1; i >= 0; i--) {
    world.wet[i].life -= dt;
    if (world.wet[i].life <= 0) world.wet.splice(i, 1);
  }

  if (world.over === 3) {
    world.postT += dt;
    if (world.postT >= 7) world.over = 1;
    return;
  }
  if (world.over) return;
  if (!world.dlg && world.t > INTRO_LOCK) {
    world.clock += dt / SEC_PER_MIN;
    if (world.clock >= CLOCK_END) { world.over = 2; return; }
  }

  // headphones
  if (player.hopho > 0) {
    player.phCharge -= dt / 9;
    if (player.phCharge <= 0) { player.phCharge = 0; player.hopho = 0; }
  } else {
    player.phCharge = Math.min(1, player.phCharge + dt / 15);
  }
  world.boost = Math.max(0, world.boost - dt);

  // movement (locked while a dialogue is open, or during the intro banner)
  let ix = 0, iy = 0;
  if (!world.dlg && world.t > INTRO_LOCK) {
    if (keys['a'] || keys['arrowleft']) ix -= 1;
    if (keys['d'] || keys['arrowright']) ix += 1;
    if (keys['w'] || keys['arrowup']) iy -= 1;
    if (keys['s'] || keys['arrowdown']) iy += 1;
    if (ix && iy) { ix *= .7071; iy *= .7071; }
  }
  const sp = SPEED * (world.boost > 0 ? 1.5 : 1);
  const wet = world.wet.some(w => Math.abs(w.x - player.x) < 12 && Math.abs(w.y - player.y) < 12);
  player.slip = wet ? 1 : Math.max(0, player.slip - dt * 2);
  const grip = player.slip > 0 ? 9 : 18;
  player.vx += (ix * sp - player.vx) * Math.min(1, grip * dt);
  player.vy += (iy * sp - player.vy) * Math.min(1, grip * dt);
  moveBy(player.vx * dt, player.vy * dt);
  player.moving = Math.hypot(player.vx, player.vy) > 8;
  if (player.moving) {
    if (Math.abs(player.vx) > Math.abs(player.vy)) player.face = player.vx < 0 ? 'left' : 'right';
    else player.face = player.vy < 0 ? 'up' : 'down';
    player.anim += dt * (world.boost > 0 ? 10 : 7);
  }

  // roamers
  for (const p of world.people) {
    p.cool = Math.max(0, p.cool - dt);
    if (p.def.kind !== 'roam') continue;
    if (world.dlg) continue;
    const hunting = p.def.id === 'gaviota' && world.step === 0;
    p.replan = (p.replan || 0) - dt;
    if (hunting && p.replan <= 0) { p.leg = null; p.replan = 1.1; }
    const r = p.def.route;
    if (!p.leg || !p.leg.length) {
      const dest = hunting
        ? [Math.floor(player.x / TS), Math.floor(player.y / TS)]
        : r[p.node];
      p.leg = findPath(Math.floor(p.x / TS), Math.floor(p.y / TS), dest[0], dest[1]);
      if (!hunting) p.node = (p.node + 1) % r.length;
      if (!p.leg) { p.leg = []; p.moving = false; continue; }
    }
    const wp = p.leg[0];
    const tx = wp[0] * TS + 8, ty = wp[1] * TS + 12;
    const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
    if (d < 2.5) { p.leg.shift(); p.x = tx; p.y = ty; }
    else {
      const st = Math.min(d, p.def.speed * dt);
      p.x += dx / d * st; p.y += dy / d * st;
      p.face = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
      p.anim += dt * 7; p.moving = true;
    }
    if (p.def.mop && Math.random() < dt * 0.9) {
      world.wet.push({ x: p.x, y: p.y + 3, life: 6 });
      if (world.wet.length > 14) world.wet.shift();
    }
    // interruption
    const pd = Math.hypot(player.x - p.x, player.y - p.y);
    if (pd < 15 && p.cool <= 0 && player.hopho <= 0 && !p.signed) {
      const want = CHAIN[world.step];
      if (want && want.id === p.def.id) {
        startChainStep(p, 5);
      } else {
        p.cool = 14;
        if (p.def.id === 'aracelis') {
          const dd = aracelisDialogue();
          openDialogue(p.def.name + ' — ' + p.def.role, dd.pages, 4, dd.choices);
        } else {
          openDialogue(p.def.name + ' — ' + p.def.role, [p.def.chat], 4);
        }
        world.shake = 2;
      }
    }
  }

  // zone hints
  ZONES.forEach((z, i) => {
    if (world.fired[i]) return;
    if (Math.hypot(player.x - (z.tx * TS + 8), player.y - (z.ty * TS + 8)) < z.r) {
      world.fired[i] = true; showHint(z.hint, 4.5);
    }
  });
}

// ---------- TARGETS ----------
let out, octx, main, mctx, mini, scale = 2;

function initGfx() {
  out = document.getElementById('screen');
  octx = out.getContext('2d');
  [main, mctx] = surf(VW, VH);

}
function resize() {
  const mobile = window.innerWidth <= 640;          // matches the CSS .touch breakpoint
  const vBudget = 96 + (mobile ? 132 : 0);           // room for the control bar below the canvas
  const s = Math.max(1, Math.min(4,
    Math.floor((window.innerWidth - 16) / VW),
    Math.floor((window.innerHeight - vBudget) / VH)));

  octx.imageSmoothingEnabled = false;
}

// ---------- TEXT ----------
function text(g, str, x, y, col, sc) {
  sc = sc || 1; g.fillStyle = col;
  x = Math.round(x); y = Math.round(y);   // fillRect antialiases off-pixel, even with smoothing off
  let cx = x;
  for (const raw of String(str).toUpperCase()) {
    let ch = raw, mark = null;
    if (ACCENTS[ch]) { mark = ACCENTS[ch][1]; ch = ACCENTS[ch][0]; }
    const rows = (GLYPHS[ch] || GLYPHS[' ']).split('/');
    for (let ry = 0; ry < 5; ry++) for (let rx = 0; rx < 3; rx++) {
      if (rows[ry][rx] === '#') g.fillRect(cx + rx * sc, y + ry * sc, sc, sc);
    }
    if (mark === 'acute') { g.fillRect(cx + 2 * sc, y - 2 * sc, sc, sc); g.fillRect(cx + sc, y - sc, sc, sc); }
    else if (mark === 'tilde') { g.fillRect(cx, y - 2 * sc, 3 * sc, sc); g.fillRect(cx + 2 * sc, y - 3 * sc, sc, sc); }
    else if (mark === 'uml') { g.fillRect(cx, y - 2 * sc, sc, sc); g.fillRect(cx + 2 * sc, y - 2 * sc, sc, sc); }
    cx += 4 * sc;
  }
  return cx - x;
}
const tw1 = s => String(s).length * 4 - 1;
function pill(g, x, y, w, h, col) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  g.fillStyle = col || 'rgba(255,255,255,0.86)';
  g.fillRect(x + 1, y, w - 2, h); g.fillRect(x, y + 1, w, h - 2);
}
function hhmm(m) {
  const h = Math.floor(m / 60) % 24, mm = Math.floor(m % 60);
  return String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
}

// ---------- CAMERA ----------
const cam = { x: 0, y: 0 };
function updateCam(dt) {
  const tx = Math.max(0, Math.min(MAPW * TS - VW, player.x - VW / 2));
  const ty = Math.max(0, Math.min(MAPH * TS - VH, player.y - VH / 2));
  const k = 1 - Math.pow(0.002, dt);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
}
function camOff() {
  const s = world.shake;
  return { x: Math.round(cam.x + (s ? (Math.random() - .5) * s : 0)),
           y: Math.round(cam.y + (s ? (Math.random() - .5) * s : 0)) };
}

// ---------- MINIMAP ----------
function bakeMini() {
  const [c, g] = surf(MAPW, MAPH);
  for (let y = 0; y < MAPH; y++) for (let x = 0; x < MAPW; x++) {
    const m = world.mat[y][x], s = world.wall[y][x];
    let col = null;
    if (m === 'hatch') col = '#8e8781';
    else if (m === 'glass' || m === 'glassClean') col = '#9fc0c8';
    else if (!s) col = m === 'turf' ? '#7fae76' : (m === 'pasillo' ? '#a49d97' : '#e4e0db');
    else col = '#6f6862';
    g.fillStyle = col; g.fillRect(x, y, 1, 1);
  }
  mini = c;
}

// ---------- RENDER ----------
function render() {
  const c = camOff();
  mctx.fillStyle = '#8e8781'; mctx.fillRect(0, 0, VW, VH);

  const x0 = Math.max(0, (c.x / TS | 0) - 1), x1 = Math.min(MAPW - 1, ((c.x + VW) / TS | 0) + 1);
  const y0 = Math.max(0, (c.y / TS | 0) - 1), y1 = Math.min(MAPH - 1, ((c.y + VH) / TS | 0) + 2);

  // --- floors
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (world.wall[ty][tx] && world.tiles[ty][tx] !== 'D') continue;
    const px = tx * TS - c.x, py = ty * TS - c.y;
    drawFloorTile(tx, ty, px, py);
  }

  // --- wet floor
  for (const w of world.wet) {
    const a = Math.min(.30, w.life / 9 * .30);
    mctx.globalAlpha = a; mctx.fillStyle = '#9fc4d4';
    mctx.fillRect(Math.round(w.x - c.x) - 6, Math.round(w.y - c.y) - 4, 13, 8);
    mctx.globalAlpha = 1;
  }

  // --- daylight shafts
  mctx.save();
  for (const wn of WINDOWS) {
    mctx.globalAlpha = .10 + Math.sin(world.t * .35 + wn.x) * .015; mctx.fillStyle = '#fff6e2';
    if (wn.side === 'E') {
      const bx = wn.x * TS - c.x, by = wn.y * TS - c.y, bh = wn.h * TS;
      mctx.beginPath();
      mctx.moveTo(bx, by); mctx.lineTo(bx, by + bh);
      mctx.lineTo(bx - 96, by + bh + 46); mctx.lineTo(bx - 96, by + 46);
      mctx.closePath(); mctx.fill();
    } else {
      const bx = wn.x * TS - c.x, by = wn.y * TS - c.y, bw2 = wn.w * TS;
      mctx.beginPath();
      mctx.moveTo(bx, by); mctx.lineTo(bx + bw2, by);
      mctx.lineTo(bx + bw2 - 40, by - 88); mctx.lineTo(bx - 40, by - 88);
      mctx.closePath(); mctx.fill();
    }
  }
  mctx.restore();

  // --- walls, partitions, doors
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const px = tx * TS - c.x, py = ty * TS - c.y;
    const m = world.mat[ty][tx], t = world.tiles[ty][tx];
    if (t === 'D') { drawDoor(px, py, m, tx, ty); continue; }
    if (!world.wall[ty][tx]) continue;
    if (m === 'glass' || m === 'glassClean') { drawGlass(px, py, tx, ty); continue; }
    if (m === 'hatch') { drawHatch(px, py, tx, ty); continue; }
    // painted partition, drawn as a plan-cut mass
    mctx.fillStyle = P.paintSh; mctx.fillRect(px, py, TS, TS);
    mctx.fillStyle = P.paint; mctx.fillRect(px, py, TS, 3);
    mctx.fillStyle = P.paintDk;
    if (ty + 1 < MAPH && !world.wall[ty + 1][tx]) mctx.fillRect(px, py + TS - 2, TS, 2);
    if (tx + 1 < MAPW && !world.wall[ty][tx + 1]) mctx.fillRect(px + TS - 1, py, 1, TS);
    if (tx > 0 && !world.wall[ty][tx - 1]) mctx.fillRect(px, py, 1, TS);
    // contact shadow onto the floor below
    if (ty + 1 < MAPH && !world.wall[ty + 1][tx]) {
      mctx.globalAlpha = .16; mctx.fillStyle = '#2b2b34';
      mctx.fillRect(px, py + TS, TS, 3); mctx.globalAlpha = 1;
    }
  }

  // --- depth-sorted furniture and people
  const items = [];
  for (const f of world.props) {
    if (f.x * TS - c.x > VW + 40 || f.x * TS - c.x + f.w * TS < -40) continue;
    items.push({ y: (f.y + f.h) * TS + (f.z || 0), d: () => drawFurn(f, c) });
  }
  for (const p of world.people) {
    if (p.x - c.x < -30 || p.x - c.x > VW + 30 || p.y - c.y < -40 || p.y - c.y > VH + 40) continue;
    items.push({ y: p.y, d: () => drawActor(p.spr, p, c, p.def.kind === 'roam' && p.moving) });
  }
  items.push({ y: player.y, d: () => drawPlayer(c) });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) it.d();

  drawTerraceBreeze(c);

  // --- overhead: track light and duct, from photo 2
  for (const ce of CEILING) {
    const px = ce.x * TS - c.x, py = ce.y * TS - c.y;
    if (ce.t === 'track') {
      mctx.globalAlpha = .10; mctx.fillStyle = '#2b2b34';
      mctx.fillRect(px + 7, py + 4, ce.w > 1 ? ce.w * TS : 3, ce.h > 1 ? ce.h * TS : 3);
      mctx.globalAlpha = .62; mctx.fillStyle = P.black;
      if (ce.h > ce.w) { mctx.fillRect(px + 6, py, 3, ce.h * TS);
        for (let i = 1; i < ce.h; i += 3) mctx.fillRect(px + 4, py + i * TS, 7, 3); }
      else { mctx.fillRect(px, py + 6, ce.w * TS, 3);
        for (let i = 1; i < ce.w; i += 3) mctx.fillRect(px + i * TS, py + 4, 3, 7); }
      mctx.globalAlpha = 1;
    } else {
      mctx.globalAlpha = .13; mctx.fillStyle = '#2b2b34';
      mctx.fillRect(px + 4, py + 5, 10, ce.h * TS); mctx.globalAlpha = 1;
      mctx.globalAlpha = .42;
      mctx.fillStyle = '#cfd2d6'; mctx.fillRect(px + 2, py, 12, ce.h * TS);
      mctx.fillStyle = '#eef0f2'; mctx.fillRect(px + 2, py, 3, ce.h * TS);
      mctx.fillStyle = '#a8adb3';
      for (let i = 0; i < ce.h; i++) mctx.fillRect(px + 2, py + i * TS, 12, 1);
      mctx.globalAlpha = 1;
    }
  }

  // --- dust in the light
  for (const m of world.motes) {
    mctx.globalAlpha = m.a; mctx.fillStyle = '#fff8e8';
    mctx.fillRect(m.x | 0, m.y | 0, 1, 1);
  }
  mctx.globalAlpha = 1;

  // --- signature sparkles when a signature lands
  for (const s of world.sparks) {
    const a = s.life;
    mctx.globalAlpha = a;
    mctx.fillStyle = P.violet;
    const r = (1 - s.life) * 16;
    const px = Math.round(s.x - c.x), py = Math.round(s.y - c.y);
    for (let i = 0; i < 8; i++) {
      const an = i / 8 * 6.2832;
      mctx.fillRect(px + Math.cos(an) * r | 0, py + Math.sin(an) * r * .6 | 0, 2, 2);
    }
    mctx.fillStyle = '#ffffff';
    mctx.fillRect(px - 1, py - 4, 2, 8); mctx.fillRect(px - 4, py - 1, 8, 2);
    mctx.globalAlpha = 1;
  }

  // Subtle screen-space depth keeps the pale floor from reading completely flat.
  mctx.globalAlpha = .055; mctx.fillStyle = P.ink;
  mctx.fillRect(0, 0, VW, 3); mctx.fillRect(0, VH - 4, VW, 4);
  mctx.fillRect(0, 0, 3, VH); mctx.fillRect(VW - 3, 0, 3, VH);
  mctx.globalAlpha = 1;

  drawHUD();
  if (world.dlg) drawDialogue();
  drawOverlays();

  octx.imageSmoothingEnabled = false;
  octx.drawImage(main, 0, 0, VW * scale, VH * scale);
}

function drawTerraceBreeze(c) {
  const left = 22 * TS, top = 2 * TS, width = 10 * TS, height = 5 * TS;
  if (left - c.x > VW || left + width - c.x < 0 || top - c.y > VH || top + height - c.y < 0) return;
  for (let i = 0; i < 8; i++) {
    const travel = (world.t * (17 + i % 3 * 4) + i * 29) % (width + 34) - 17;
    const lift = Math.sin(world.t * 1.8 + i * 1.7) * 5;
    const px = Math.round(left + travel - c.x), py = Math.round(top + 13 + (i * 17) % (height - 20) + lift - c.y);
    const edgeFade = Math.min(1, travel / 18, (width - travel) / 18);
    mctx.globalAlpha = Math.max(0, edgeFade) * .42;
    mctx.fillStyle = '#eef7e9';
    mctx.fillRect(px, py, 7, 1); mctx.fillRect(px + 8, py - 1, 5, 1); mctx.fillRect(px + 14, py, 3, 1);
    if (i % 2 === 0) {
      mctx.fillStyle = i % 4 === 0 ? '#d3b45f' : '#8fba70';
      mctx.fillRect(px + 9, py + 2, 2, 2); mctx.fillRect(px + 11, py + 3, 1, 1);
    }
  }
  mctx.globalAlpha = 1;
}

function drawGlass(px, py, tx, ty) {
  mctx.globalAlpha = .5; mctx.fillStyle = P.glass; mctx.fillRect(px, py, TS, TS);
  mctx.globalAlpha = 1;
  mctx.fillStyle = P.black;
  // Orientation follows the wall run itself (any material), not just glass
  // neighbours -- otherwise the last tile before a door or a corner always
  // lost its vertical/horizontal alignment, since one neighbour was never
  // going to be glass too.
  const wUp = ty > 0 && world.wall[ty - 1][tx], wDn = ty + 1 < MAPH && world.wall[ty + 1][tx];
  const wLf = tx > 0 && world.wall[ty][tx - 1], wRt = tx + 1 < MAPW && world.wall[ty][tx + 1];
  const vert = (wUp || wDn) && !(wLf || wRt);
  // Two rails on the faces of the partition instead of one down the middle,
  // which is how glazing reads in plan. Neighbouring tiles join into a
  // continuous pair of lines along the run.
  if (vert) { mctx.fillRect(px, py, 2, TS); mctx.fillRect(px + TS - 2, py, 2, TS); }
  else { mctx.fillRect(px, py, TS, 2); mctx.fillRect(px, py + TS - 2, TS, 2); }
  if ((tx * 3 + ty) % 5 === 0) {
    mctx.globalAlpha = .28; mctx.fillStyle = '#ffffff';
    if (vert) { mctx.fillRect(px + 5, py + 3, 1, 7); mctx.fillRect(px + 8, py + 6, 1, 5); }
    else { mctx.fillRect(px + 3, py + 5, 7, 1); mctx.fillRect(px + 6, py + 8, 5, 1); }
    mctx.globalAlpha = 1;
  }
  if (world.mat[ty][tx] === 'glassClean') return;    // this run has no sticky notes
  // sticky notes and marker, straight off the real partition
  const h = (tx * 31 + ty * 17) % 11;
  if (h === 0) { mctx.fillStyle = P.pink; mctx.fillRect(px + 3, py + 2, 4, 3); }
  if (h === 3) { mctx.fillStyle = P.cyan; mctx.fillRect(px + 9, py + 10, 4, 3); }
  if (h === 6) { mctx.fillStyle = P.pink; mctx.fillRect(px + 4, py + 9, 3, 3);
                 mctx.fillStyle = P.cyan; mctx.fillRect(px + 9, py + 3, 3, 3); }
}
function drawHatch(px, py, tx, ty) {
  mctx.fillStyle = '#c4bdb7'; mctx.fillRect(px, py, TS, TS);
  mctx.strokeStyle = '#9a938d'; mctx.lineWidth = 1;
  mctx.beginPath();
  for (let i = -TS; i < TS; i += 5) { mctx.moveTo(px + i, py + TS); mctx.lineTo(px + i + TS, py); }
  mctx.stroke();
  mctx.fillStyle = '#8e8781'; mctx.fillRect(px, py, TS, 1); mctx.fillRect(px, py, 1, TS);
}
// Floor material lives in world.floor, separate from world.mat (which holds
// wall material or, on a door tile, the door's own kind) -- so a door sitting
// in a porcDk room still shows porcDk underneath instead of always defaulting
// to plain porc.
function floorTileSet(m) {
  if (m === 'turf') return TILES.turf;
  if (m === 'pasillo') return TILES.pasillo;
  return TILES[m] || TILES.porc;
}
function drawFloorTile(tx, ty, px, py) {
  const set = floorTileSet(world.floor[ty][tx]);
  if (set === TILES.porc || set === TILES.porcDk) {
    const gi = (tx % 2) + (ty % 2) * 2, v = (tx * 7 + ty * 11) % 3;
    mctx.drawImage(set[gi * 3 + v], px, py);
  } else mctx.drawImage(set[(tx * 5 + ty * 3) % 3], px, py);
}
function drawDoor(px, py, k, tx, ty) {
  drawFloorTile(tx, ty, px, py);
  if (k === 'open') return;
  mctx.fillStyle = k === 'slider' || k === 'glassdoor' ? P.black : P.woodDk;
  const vert = ty > 0 && world.wall[ty - 1][tx] && ty + 1 < MAPH && world.wall[ty + 1][tx];
  if (k === 'slider' || k === 'glassdoor') {
    mctx.globalAlpha = .45; mctx.fillStyle = P.glass;
    mctx.fillRect(px, py, TS, TS); mctx.globalAlpha = 1;
    mctx.fillStyle = P.black;
    if (vert) mctx.fillRect(px + 6, py, 2, TS); else mctx.fillRect(px, py + 6, TS, 2);
  } else {
    // door leaf swung open, plan convention
    mctx.fillStyle = P.wood;
    if (vert) mctx.fillRect(px + 5, py, 4, 3); else mctx.fillRect(px, py + 5, 3, 4);
    mctx.strokeStyle = 'rgba(43,43,52,0.22)'; mctx.lineWidth = 1;
    mctx.beginPath(); mctx.arc(px + 2, py + 2, TS - 3, 0, Math.PI / 2); mctx.stroke();
  }
}

// ---------- FURNITURE ----------
function drawFurn(f, c) {
  const px = f.x * TS - c.x, py = f.y * TS - c.y, w = f.w * TS, h = f.h * TS;
  const R = (x, y, ww, hh, col) => { mctx.fillStyle = col; mctx.fillRect(x, y, ww, hh); };
  const sh = () => { mctx.globalAlpha = .18; R(px + 2, py + h - 1, w, 3, '#2b2b34'); mctx.globalAlpha = 1; };
  switch (f.t) {
    case 'desk': {
      sh(); R(px, py, w, h, P.maple); R(px, py, w, 1, P.woodLt); R(px, py + h - 2, w, 2, P.mapleDk);
      for (let i = 2; i < f.w; i += 3) R(px + i * TS - 4, py + 2, 3, h - 5, P.white);  // pedestals
      const mony = f.h > 1 ? py + h / 2 - 3 : py + 1;
      for (let i = 0; i < f.w - 1; i += 3) {                                          // monitors
        const phase = (Math.floor(world.t * 1.4) + f.x + f.y + i) % 5;
        const screen = phase === 0 ? '#27323b' : phase === 1 ? '#40546b' : phase === 2 ? '#51467e' : '#355d63';
        R(px + i * TS + 5, mony, 11, 6, P.black);
        R(px + i * TS + 6, mony + 1, 9, 4, screen);
        R(px + i * TS + 7, mony + 2, 5, 1, phase === 2 ? P.violetLt : P.cyan);
        R(px + i * TS + 7, mony + 4, 7, 1, 'rgba(255,255,255,.22)');
      }
      break; }
    case 'exdesk':
      sh(); R(px, py, w, h, P.wood); R(px, py, w, 1, P.woodLt); R(px, py + h - 2, w, 2, P.woodDk);
      R(px + 4, py + 4, 12, 7, P.black); R(px + 5, py + 5, 10, 5, '#354e61');
      R(px + 6, py + 6, 7, 1, Math.sin(world.t * 1.8 + f.y) > 0 ? P.cyan : P.violetLt);
      R(px + 6, py + 8, 5, 1, 'rgba(255,255,255,.25)');
      R(px + 5, py + h - 8, 8, 4, P.white); break;
    case 'ctable':
      sh(); R(px, py, w, h, P.white); R(px, py, w, 1, '#ffffff'); R(px, py + h - 2, w, 2, P.whiteSh);
      R(px + w / 2 - 8, py + h / 2 - 3, 16, 6, P.paintSh); break;
    case 'oval':
      mctx.globalAlpha = .18; mctx.fillStyle = '#2b2b34';
      mctx.beginPath(); mctx.ellipse(px + w / 2, py + h - 1, w / 2, h / 2.4, 0, 0, 6.283); mctx.fill();
      mctx.globalAlpha = 1;
      mctx.fillStyle = P.white;
      mctx.beginPath(); mctx.ellipse(px + w / 2, py + h / 2, w / 2 - 1, h / 2.2, 0, 0, 6.283); mctx.fill();
      mctx.strokeStyle = P.whiteSh; mctx.lineWidth = 1; mctx.stroke();
      R(px + w / 2 - 4, py + h / 2 - 3, 8, 6, '#e8e4de'); break;
    case 'counter':
      sh(); R(px, py, w, h, P.white); R(px, py, w, 2, '#ffffff'); R(px, py + h - 2, w, 2, P.whiteSh);
      for (let i = 1; i < f.h; i++) R(px, py + i * TS, w, 1, P.whiteSh); break;
    case 'coffee':
      R(px + 3, py + 1, 11, 13, P.black); R(px + 5, py + 4, 7, 5, '#4a3a2c');
      R(px + 5, py + 3, 7, 1, P.amber);
      mctx.globalAlpha = .32 + Math.sin(world.t * 3) * .10;
      const steam = Math.floor(world.t * 5) % 7;
      R(px + 7 + (steam % 2), py - 2 - steam, 1, 3, P.white);
      R(px + 10 - (steam % 2), py - 5 - ((steam + 3) % 7), 1, 2, P.white);
      mctx.globalAlpha = 1;
      break;
    case 'fridge':
      sh(); R(px, py, w, h, P.white); R(px + w / 2, py + 3, 1, 9, P.whiteSh);
      R(px + w / 2 - 3, py + 5, 1, 5, P.paintDk); R(px + w / 2 + 2, py + 5, 1, 5, P.paintDk);
      break;
    case 'plotter':
      sh(); R(px, py, w, h, '#d8d4cf'); R(px, py, w, 3, '#eceae6');
      R(px + 2, py + h - 8, w - 4, 4, P.paintDk);
      R(px + 3, py + 4, 6, 3, world.printed ? P.violet : P.cyan);
      R(px + 11, py + 5, 2, 1, Math.sin(world.t * 5) > 0 ? P.amber : P.paintDk);
      if (world.printed) {
        R(px + 5, py + h - 10, w - 10, 7, P.white);
        R(px + 7, py + h - 8, w - 14, 1, '#93a6b2');
        R(px + 7, py + h - 6, w - 17, 1, P.violetLt);
      }
      if (currentObjective() === PRINT_OBJECTIVE) {
        const bob = Math.sin(world.t * 4) * 2 | 0;
        R(px + w / 2 - 2, py - 8 + bob, 4, 4, P.pink);
        R(px + w / 2 - 1, py - 4 + bob, 2, 2, P.pink);
      }
      break;
    case 'sofa':
      sh(); R(px, py, w, h, '#8f9298'); R(px, py, w, 4, '#a3a6ac');
      for (let i = 0; i < f.w; i++) R(px + i * TS + 2, py + 5, TS - 4, h - 7, '#7e8188'); break;
    case 'bench': sh(); R(px, py + 4, w, 8, P.wood); R(px, py + 4, w, 1, P.woodLt); break;
    case 'cabinet':
      sh(); R(px, py, w, h, P.white); R(px + w - 2, py, 2, h, P.whiteSh);
      for (let i = 0; i < f.h; i++) { R(px, py + i * TS, w, 1, P.whiteSh);
        R(px + 3, py + i * TS + 7, 6, 1, P.paintDk); } break;
    case 'tv': {
      R(px + 2, py, w - 2, h, P.black); R(px + 4, py + 2, w - 6, h - 4, '#263844');
      const scan = Math.floor(world.t * 8 + f.y) % Math.max(2, h - 6);
      R(px + 6, py + 5 + scan, Math.max(2, w - 10), 1, 'rgba(34,224,255,.32)');
      R(px + 6, py + 5, Math.max(2, (w - 10) * .55), 2, P.violet);
      break; }
    case 'ptable':
      mctx.globalAlpha = .2; R(px + 2, py + h - 2, w, 3, '#2b2b34'); mctx.globalAlpha = 1;
      R(px + 1, py + 1, w - 2, h - 4, P.black); R(px + 2, py + 2, w - 4, h - 6, '#3a3a44');
      R(px, py + h - 4, 2, 4, P.black); R(px + w - 2, py + h - 4, 2, 4, P.black); break;
    case 'gchair': R(px + 3, py + 4, 10, 9, '#4a4a55'); R(px + 3, py + 3, 10, 2, '#5c5c68'); break;
    case 'plant':
      R(px + 5, py + 8, 6, 7, '#b98a63'); R(px + 5, py + 8, 6, 1, '#cfa079');
      mctx.fillStyle = P.plant;
      for (let i = 0; i < 7; i++) {
        const a = i / 7 * 6.283 + 0.4;
        const sway = Math.sin(world.t * .9 + f.x + i) * .65;
        mctx.fillRect(px + 8 + Math.cos(a) * 4 + sway | 0, py + 6 + Math.sin(a) * 4 | 0, 3, 3);
      }
      R(px + 7, py + 3, 3, 4, P.plantDk); break;
  }
}

// ---------- ACTORS ----------
function facingNeedsMirror(face) {
  // The baked profile points right (nose at x=9). Mirror only for left.
  return face === 'left';
}

// Greedy word-wrap at the given scale, respecting any line breaks the
// dialogue text already has (some lines are broken deliberately for pacing,
// e.g. a punchline on its own line) and only splitting further where a
// paragraph is too wide for the box.
function wrapText(str, maxW, sc) {
  const out = [];
  for (const para of String(str).split('\n')) {
    const words = para.split(' ');
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (line && tw1(test) * sc > maxW) { out.push(line); line = w; }
      else line = test;
    }
    out.push(line);
  }
  return out;
}
function drawDialogue() {
  // Back to the original size: plain text at sc=1, same as every other HUD
  // label. wrapText stays only as a safety net (splits a line if it's ever

  // so it's invisible in practice, just a guard against future edits.
  const d = world.dlg, bx = 10, bw = VW - 20;

  mctx.fillRect(bx, by, 1, bh); mctx.fillRect(bx + bw - 1, by, 1, bh);

  if (showChoices) {
    const startY = by + 18 + lines.length * 9 + 5;

      if (sel) text(mctx, '>', bx + 6, y, P.violet);

    });
    const hint = window.innerWidth <= 640 ? 'ARRASTRA ELEGIR · E CONFIRMAR' : 'A/D ELEGIR · E CONFIRMAR';

// ---------- INPUT ----------
function doRestart() {
  buildWorld(); bakeMini(); world.t = 0;
  cam.x = player.x - VW / 2; cam.y = player.y - VH / 2;
}
function doPauseToggle() {
  if (world.t > INTRO_LOCK && !world.over) world.paused = !world.paused;
}
function doInteract() {
  if (world.paused || world.t <= INTRO_LOCK) return;
  interact();
}
function doHeadphoneToggle() {
  if (world.paused || world.t <= INTRO_LOCK) return;
  if (world.dlg) { if (onLastPage() && world.dlg.choices) selectChoice(); else advanceDialogue(); }
  else if (player.hopho > 0) player.hopho = 0;
  else if (player.phCharge > .12) player.hopho = 1;
}
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'e', 'p'].includes(k)) e.preventDefault();
  if (k === 'r') { doRestart(); keys[k] = true; return; }
  if (k === 'p') { doPauseToggle(); return; }
  if (world.paused || world.t <= INTRO_LOCK) { keys[k] = true; return; }   // frozen: track the key, do nothing else
  if (onLastPage() && world.dlg.choices &&
      ['a', 'd', 'arrowleft', 'arrowright', 'w', 's', 'arrowup', 'arrowdown'].includes(k)) {
    cycleChoice(1);          // binary choice: either key just toggles the other option
    keys[k] = true; return;
  }
  if (k === 'e' && !ePressed) { ePressed = true; doInteract(); }
  if (k === ' ' && !keys[' ']) { doHeadphoneToggle(); }
  keys[k] = true;
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'e') ePressed = false;
  keys[k] = false;
});
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; ePressed = false; });

// touch: drag the left half to walk, tap the right half to talk
// Explicit on-screen buttons (mobile only -- #touchpad is hidden on desktop
// via the same CSS breakpoint as the keyboard-vs-touch instruction text).
// Directional buttons hold like a key; the rest fire once per tap through
// the same functions the keyboard uses.
function bindTapButton(id, fn) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('touchstart', e => { e.preventDefault(); fn(); }, { passive: false });
}
const JOY_R = 36;   // max knob travel in px, matches the CSS knob/base sizing
function bindJoystick() {
  const zone = document.getElementById('tp-joyzone');
  const base = document.getElementById('tp-joybase');
  const knob = document.getElementById('tp-joyknob');
  if (!zone || !base || !knob) return;
  let touchId = null, ox = 0, oy = 0, cycled = false;

  function place(el, x, y) { el.style.left = x + 'px'; el.style.top = y + 'px'; }
  function release() {
    touchId = null; keys.a = keys.d = keys.w = keys.s = false;
    base.style.opacity = 0; knob.style.opacity = 0;
  }
  zone.addEventListener('touchstart', e => {
    e.preventDefault();
    if (touchId !== null) return;               // one finger drives the stick
    const t = e.changedTouches[0], r = zone.getBoundingClientRect();
    touchId = t.identifier; ox = t.clientX - r.left; oy = t.clientY - r.top; cycled = false;
    place(base, ox, oy); place(knob, ox, oy);
    base.style.opacity = 1; knob.style.opacity = 1;
  }, { passive: false });
  zone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier !== touchId) continue;
      const r = zone.getBoundingClientRect();
      const dx = (t.clientX - r.left) - ox, dy = (t.clientY - r.top) - oy, m = Math.hypot(dx, dy);
      const cl = m > JOY_R ? JOY_R / m : 1;
      place(knob, ox + dx * cl, oy + dy * cl);
      if (onLastPage() && world.dlg && world.dlg.choices) {
        if (!cycled && m >= 8) { cycleChoice(1); cycled = true; }   // one toggle per drag
        continue;
      }
      keys.a = keys.d = keys.w = keys.s = false;
      if (m < 8) continue;                       // deadzone
      if (dx / m < -.38) keys.a = true; if (dx / m > .38) keys.d = true;
      if (dy / m < -.38) keys.w = true; if (dy / m > .38) keys.s = true;
    }
  }, { passive: false });
  const end = e => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === touchId) release();
  };
  zone.addEventListener('touchend', end, { passive: false });
  zone.addEventListener('touchcancel', end, { passive: false });
}
function bindTouch() {
  bindJoystick();
  bindTapButton('tp-e', doInteract);
  bindTapButton('tp-ph', doHeadphoneToggle);
  bindTapButton('tp-p', doPauseToggle);
  bindTapButton('tp-r', doRestart);
}

// ---------- LOOP ----------
let last = 0, acc = 0;
const STEP = 1 / 120;
function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  let dt = (now - last) / 1000; last = now;
  if (dt > .25) dt = .25;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 8) { update(STEP); acc -= STEP; n++; }
  updateCam(dt);
  render();
}
function boot() {
  initGfx(); buildWorld(); bakeMini(); bindTouch();
  cam.x = Math.max(0, Math.min(MAPW * TS - VW, player.x - VW / 2));
  cam.y = Math.max(0, Math.min(MAPH * TS - VH, player.y - VH / 2));
  requestAnimationFrame(frame);
}
boot();
try { out.focus(); } catch (e) { }
out.addEventListener('pointerdown', () => out.focus());

</script>
